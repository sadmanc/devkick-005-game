name: Mobile
on:
  pull_request:
    paths: ['mobile/**', 'src/**', 'assets/**', 'public/**', 'index.html', 'vite.config.js', 'package*.json', '.github/workflows/mobile.yml']
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mobile
      - name: Build for the iOS simulator (unsigned)
        working-directory: mobile
        run: npm run build:ios-sim
      - name: Launch in the simulator, click through the first screens, screenshot each one
        working-directory: mobile
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl privacy "$UDID" grant microphone com.soundlocal.app
          mkdir -p smoke
          start=$SECONDS
          xcrun simctl launch --console-pty "$UDID" com.soundlocal.app \
            -smokeClicks "14:#play,24:#consent-agree,34:.pin.live,44:#intro-start,54:.cast-card" > smoke/console.log 2>&1 &
          for t in 10 20 30 40 50 62 80; do
            while (( SECONDS - start < t )); do sleep 1; done
            xcrun simctl io "$UDID" screenshot "smoke/$(printf %02d $t)s.png"
          done
          (cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -qry ../../../../../../smoke/SoundLocal-simulator.app.zip App.app)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-smoke
          path: mobile/smoke/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix mobile
      - name: Build the debug APK
        working-directory: mobile
        run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: sound-local-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
