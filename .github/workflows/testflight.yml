name: TestFlight
# Run by hand (Actions tab -> TestFlight -> Run workflow). Signs with Xcode cloud signing using an
# App Store Connect API key and uploads the build to TestFlight. No Mac needed.
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: macos-15
    env:
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the secrets are set
        run: |
          for v in ISSUER KEY_ID TEAM; do [ -n "${!v}" ] || { echo "Missing secret for $v"; exit 1; }; done
      - name: Write the API key
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          [ -s "$RUNNER_TEMP/AuthKey.p8" ] || { echo "Missing secret APPSTORE_P8"; exit 1; }
      - run: npm ci
      - run: npm ci --prefix mobile
      - name: Build the web game and copy it into the iOS project
        working-directory: mobile
        run: npm run build:web && npx cap sync ios
      - name: Archive (signed)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
